[project]
name = "renewal-advisor"
version = "0.1.0"
description = "Small-group health renewal advisor POC"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "pandas>=2.1"]

[project.optional-dependencies]
app = ["streamlit>=1.35", "plotly>=5.20", "pdfplumber>=0.11", "anthropic>=0.40"]
dev = ["pytest>=8", "reportlab>=4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
